name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Two pushes in a row would otherwise both pick the same
# candidate number, and the loser would fail on a tag that already exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Host-side tracker tests: fast, no Docker, no cross-compiler.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: make test

  # Cross-compile in the SDK image and publish PocketBookStatistics.zip.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      pull-requests: write # the comment naming the candidate
    steps:
      - uses: actions/checkout@v4

      # The in-app update check compares the release tag against the version
      # compiled into the binary. If they disagree, an installed build keeps
      # offering an update it already is.
      - name: Check VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" \
            || { echo "VERSION=$(cat VERSION) but tag is $GITHUB_REF_NAME"; exit 1; }

      # A device-side change is only ever proved on the device, and the way
      # there is a pre-release: /releases/latest ignores those, so an ordinary
      # reader keeps seeing the last final version and only the one carrying
      # the `prerelease` marker file is offered a candidate.
      #
      # The opt-in is VERSION itself. A pull request that bumps it above the
      # last release gets every push published as the next candidate of that
      # version; a pull request that leaves VERSION alone publishes nothing,
      # which is what keeps the release list from filling up with builds
      # nobody intends to install.
      #
      # VERSION is rewritten here rather than after the build, because the
      # binary has to carry the same string as the tag: the updater compares
      # the release's tag_name against APP_VERSION, and a build stamped 1.7.0
      # would refuse every 1.7.0-rcN that came after it.
      - name: Stamp a candidate version for this pull request
        id: candidate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Any suffix the file already carries is ours to replace.
          BASE=$(sed 's/-.*//' VERSION)
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || true)
          if [ -n "$LATEST" ] \
             && [ "$(printf '%s\n%s\n' "$LATEST" "$BASE" | sort -V | tail -n1)" = "$LATEST" ]; then
            echo "VERSION is $BASE, the last release is v$LATEST — no candidate published."
            echo "Set VERSION to the release this branch is heading for to get one." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Count tags, not releases: a finished -rc run has its releases
          # deleted and its tags may outlive them, and reusing a tag fails.
          N=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name' \
              | sed -n "s/^v$BASE-rc\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n1)
          N=$(( ${N:-0} + 1 ))
          echo "$BASE-rc$N" > VERSION
          echo "tag=v$BASE-rc$N" >> "$GITHUB_OUTPUT"
          echo "Publishing v$BASE-rc$N" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch PocketBook SDK
        run: make sdk

      # rcc embeds the QML verbatim, so a syntax error would only surface on
      # the device. qmllint cannot resolve the firmware's QML modules (they are
      # armel), so its import and unqualified-access warnings are noise — only
      # the exit code, which flags actual parse errors, is meaningful here.
      - name: Check QML syntax
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/fstanis/pocketbook-sdk-qt6-builder \
            bash -c '/usr/lib/qt6/bin/qmllint qt/qml/*.qml' > qmllint.log 2>&1 \
            || { cat qmllint.log; exit 1; }
          rm qmllint.log

      - name: Build
        run: make qt

      - name: Package
        run: |
          cp build-qt/PocketBookStatistics.app .
          zip -9 PocketBookStatistics.zip PocketBookStatistics.app

      - uses: actions/upload-artifact@v4
        with:
          name: PocketBookStatistics
          path: PocketBookStatistics.zip

      # The tag points at the head of the branch, while what was built is the
      # merge of that head into main — which is the version worth installing,
      # and the same thing the checks passed on.
      - name: Publish the candidate
        if: steps.candidate.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release create "$TAG" PocketBookStatistics.zip \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "$TAG (PR #$PR)" \
            --notes "Device build of #$PR at \`${HEAD_SHA:0:7}\`, merged into \`main\`. A pre-release: only a reader carrying the \`prerelease\` marker file is ever offered it."
          gh pr comment "$PR" --body \
            "Device build published as [\`$TAG\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) — the reader with the \`prerelease\` marker will find it under ⓘ → *Check for update*."

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with -rc goes out as a pre-release: /releases/latest then keeps
        # answering with the last final version, so only devices carrying the
        # opt-in marker file are ever offered a candidate.
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc*) PRE=--prerelease ;;
            *)     PRE= ;;
          esac
          gh release create "$GITHUB_REF_NAME" PocketBookStatistics.zip \
            --generate-notes $PRE
