name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Two pushes in a row would otherwise both pick the same
# candidate number, and the loser would fail on a tag that already exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Host-side tracker tests: fast, no Docker, no cross-compiler.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: make test

  # Cross-compile in the SDK image and publish PocketBookStatistics.zip.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      pull-requests: write # the comment naming the candidate
    steps:
      - uses: actions/checkout@v4

      # The in-app update check compares the release tag against the version
      # compiled into the binary. If they disagree, an installed build keeps
      # offering an update it already is.
      - name: Check VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" \
            || { echo "VERSION=$(cat VERSION) but tag is $GITHUB_REF_NAME"; exit 1; }

      # A device-side change is only ever proved on the device, and the way
      # there is a pre-release: /releases/latest ignores those, so an ordinary
      # reader keeps seeing the last final version and only the one carrying
      # the `prerelease` marker file is offered one.
      #
      # These are published as vX.Y.Z-prN, not -rcN: a candidate is something
      # aimed at a release, while this is whatever the branch happens to be at.
      # They share one counter with the candidates, so the numbers never
      # collide and version_compare() can order them by the number alone.
      #
      # Asked for, never automatic. Most pushes to a branch are not worth
      # installing, and a release list full of them is unreadable. Two ways to
      # ask, both read off the commit at the head of the branch:
      #
      #   * the word [device] anywhere in its message, or
      #   * a change to VERSION in it.
      #
      # VERSION also has to stand above the last release, or the reader would
      # never be offered the build at all; when it does not, the run says so
      # rather than publishing something nobody can install.
      #
      # VERSION is rewritten here rather than after the build, because the
      # binary has to carry the same string as the tag: the updater compares
      # the release's tag_name against APP_VERSION, and a build stamped 2.1.0
      # would refuse every 2.1.0-prN that came after it.
      - name: Stamp a device build for this pull request
        id: candidate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA")
          MSG=$(printf '%s' "$COMMIT" | jq -r .commit.message)
          ASKED=0
          case "$MSG" in
            *'[device]'*) ASKED=1 ;;
          esac
          if printf '%s' "$COMMIT" | jq -r '.files[].filename' | grep -qx VERSION; then
            ASKED=1
          fi
          if [ "$ASKED" = 0 ]; then
            echo "No device build for this push." >> "$GITHUB_STEP_SUMMARY"
            echo "Put \`[device]\` in the commit message, or bump \`VERSION\`, to get one." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Any suffix the file already carries is ours to replace.
          BASE=$(sed 's/-.*//' VERSION)
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || true)
          if [ -n "$LATEST" ] \
             && [ "$(printf '%s\n%s\n' "$LATEST" "$BASE" | sort -V | tail -n1)" = "$LATEST" ]; then
            echo "::warning::VERSION is $BASE and the last release is v$LATEST, so a build would never be offered to the reader. Nothing published."
            echo "Asked for a device build, but VERSION ($BASE) is not above the last release (v$LATEST), so nothing was published." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Count tags, not releases: a finished run has its releases deleted
          # and its tags may outlive them, and reusing a tag fails. Candidates
          # and pull request builds share the counter.
          # grep -E for the alternation and sed for the strip: BRE alternation
          # is a GNU extension, and this has to be checkable off the runner.
          N=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name' \
              | grep -E "^v$BASE-(rc|pr)[0-9]+$" \
              | sed "s/^v$BASE-[a-z]*//" | sort -n | tail -n1)
          N=$(( ${N:-0} + 1 ))
          echo "$BASE-pr$N" > VERSION
          echo "tag=v$BASE-pr$N" >> "$GITHUB_OUTPUT"
          echo "Publishing v$BASE-pr$N" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch PocketBook SDK
        run: make sdk

      # rcc embeds the QML verbatim, so a syntax error would only surface on
      # the device. qmllint cannot resolve the firmware's QML modules (they are
      # armel), so its import and unqualified-access warnings are noise — only
      # the exit code, which flags actual parse errors, is meaningful here.
      - name: Check QML syntax
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/fstanis/pocketbook-sdk-qt6-builder \
            bash -c '/usr/lib/qt6/bin/qmllint qt/qml/*.qml' > qmllint.log 2>&1 \
            || { cat qmllint.log; exit 1; }
          rm qmllint.log

      - name: Build
        run: make qt

      - name: Package
        run: |
          cp build-qt/PocketBookStatistics.app .
          zip -9 PocketBookStatistics.zip PocketBookStatistics.app

      - uses: actions/upload-artifact@v4
        with:
          name: PocketBookStatistics
          path: PocketBookStatistics.zip

      # The tag points at the head of the branch, while what was built is the
      # merge of that head into main — which is the version worth installing,
      # and the same thing the checks passed on.
      - name: Publish the device build
        if: steps.candidate.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release create "$TAG" PocketBookStatistics.zip \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "$TAG (PR #$PR)" \
            --notes "Device build of #$PR at \`${HEAD_SHA:0:7}\`, merged into \`main\`. A pre-release: only a reader carrying the \`prerelease\` marker file is ever offered it. Not a release candidate: it is whatever the branch was at when it was asked for."
          gh pr comment "$PR" --body \
            "Device build published as [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with -rc goes out as a pre-release: /releases/latest then keeps
        # answering with the last final version, so only devices carrying the
        # opt-in marker file are ever offered a candidate.
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc*|*-pr*) PRE=--prerelease ;;
            *)           PRE= ;;
          esac
          gh release create "$GITHUB_REF_NAME" PocketBookStatistics.zip \
            --generate-notes $PRE
